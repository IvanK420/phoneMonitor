<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>PhoneBox Lite</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="panel" id="root">
      <section class="row gauges">
        <article class="tile gauge" id="cpu" data-level="unknown">
          <h2>CPU</h2>
          <div class="gauge-body">
            <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="track" cx="60" cy="60" r="50" pathLength="100" />
              <circle class="arc" cx="60" cy="60" r="50" pathLength="100" stroke-dasharray="0 100" />
            </svg>
            <div class="readout"><span class="value">—</span><span class="detail"></span></div>
          </div>
        </article>

        <article class="tile gauge" id="ram" data-level="unknown">
          <h2>RAM</h2>
          <div class="gauge-body">
            <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="track" cx="60" cy="60" r="50" pathLength="100" />
              <circle class="arc" cx="60" cy="60" r="50" pathLength="100" stroke-dasharray="0 100" />
            </svg>
            <div class="readout"><span class="value">—</span><span class="detail"></span></div>
          </div>
        </article>

        <article class="tile gauge" id="gpu" data-level="unknown" hidden>
          <h2>GPU <span class="name"></span></h2>
          <div class="gauge-body">
            <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="track" cx="60" cy="60" r="50" pathLength="100" />
              <circle class="arc" cx="60" cy="60" r="50" pathLength="100" stroke-dasharray="0 100" />
            </svg>
            <div class="readout"><span class="value">—</span><span class="detail"></span></div>
          </div>
        </article>
      </section>

      <section class="row bottom">
        <article class="tile net" id="net">
          <h2>Réseau</h2>
          <div class="rates">
            <span class="down">↓ <b>—</b></span>
            <span class="up">↑ <b>—</b></span>
          </div>
          <svg class="spark" viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true">
            <path class="down-line" d="" />
            <path class="up-line" d="" />
          </svg>
        </article>

        <article class="tile ai" id="ai">
          <h2>Sessions IA</h2>
          <ul class="sessions" id="ai-list"></ul>
          <p class="placeholder" id="ai-empty">Aucune session active</p>
          <p class="more" id="ai-more" hidden></p>
        </article>
      </section>

      <section class="disks" id="disks" aria-label="Disques"></section>
    </main>

    <div class="status" id="status" role="status" hidden>Hors ligne</div>
  </body>
</html>
